name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: Package Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: npm pack dry run (verify dist, skills, docs)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const fs = require('fs');
            const files = JSON.parse(fs.readFileSync('pack.json', 'utf8'))[0].files.map(x => x.path);
            const required = [
              'dist/index.js',
              'dist/cli/main.js',
              'dist/cli/setup.js',
              'skills/agentbridge-delegate/SKILL.md',
              'README.md',
              'LICENSE'
            ];
            for (const req of required) {
              if (!files.includes(req)) {
                console.error('Missing expected file in npm package:', req);
                process.exit(1);
              }
            }
            console.log('Package verification passed (' + files.length + ' files)');
          "
      - name: CLI starts and shows help
        run: |
          node dist/cli/main.js --help
          node dist/cli/main.js setup --help
